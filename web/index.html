<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단계별 학습실</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
<header><strong>단계별 학습실</strong><span id="identity">내부 시연</span><button id="switch" hidden>다른 계정으로 전환</button></header>
<main id="main"></main>
<template id="login">
<section><p class="eyebrow">내부 시연 · 가상 계정</p><h1>학습실에 들어가기</h1>
<form id="signin"><label>계정 ID<input name="name" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label>비밀번호<input name="password" autocomplete="current-password" type="password" required></label>
<button>로그인</button></form></section>
</template>
<template id="learner">
<section class="hero"><p class="eyebrow">사지선다 · 데모</p><h1>단계별 연습</h1>
<p>원하는 단계나 전체 범위를 선택해 연습하세요.</p>
<div class="actions study-actions"><label>학습 범위<select id="category"></select></label><button id="quick">랜덤 1문제 · 30초–1분</button><button id="regular">정기 교육 · 약 5분</button><button id="all-questions">선택 범위 전체 풀기</button></div></section>
<section id="quiz"></section>
<section><h2>복습 알림</h2><form id="settings"><label>알림 간격
<select name="minutes"><option value="0">끄기</option><option value="1">1분 · 시연용</option><option value="15">15분</option><option value="30">30분</option><option value="60">1시간</option><option value="1440">하루</option></select></label><button>저장</button></form></section>
<section><h2>내 학습 이력</h2><div id="history"></div></section>
</template>
<template id="admin">
<section><p class="eyebrow">관리자 · 가상 계정 운영</p><h1>학습 현황</h1>
<div class="actions"><button id="refresh">새로고침</button><button id="print">인쇄 / PDF 저장</button></div>
<p id="report-date"></p><div id="users"></div></section>
<section class="no-print"><details id="evidence"><summary>문항 근거와 외부 원문</summary><p>예제 문항의 참고 위치를 표시합니다.</p><div id="evidence-content"></div></details></section>
<section class="no-print"><h2>학습자 계정 만들기</h2>
<form id="create"><label>계정 ID<input name="name" required pattern="[a-zA-Z0-9_\-]{3,32}"></label>
<label>초기 비밀번호<input name="password" type="password" minlength="12" maxlength="128" required></label><button>등록</button></form></section>
<section class="no-print"><h2>알림 보내기</h2>
<form id="notice"><label>대상<select name="target"></select></label><label>메시지<input name="message" maxlength="300" required></label><button>보내기</button></form></section>
</template>
<aside id="toast" role="status" hidden></aside>
</html>
